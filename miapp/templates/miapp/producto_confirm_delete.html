{% extends 'miapp/base.html' %}

{% block content %}
<div class="container my-5 text-center" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
        <h2 class="text-danger mb-3">¿Eliminar producto?</h2>
        <p class="fs-5">
            ¿Estás seguro de que deseas eliminar <strong>"{{ object.nombre }}"</strong>?
        </p>
        <p class="text-muted small">Esta acción no se puede deshacer.</p>

        <form method="POST" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Sí, eliminar</button>
            <a href="{% url 'detalle_producto' object.pk %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
